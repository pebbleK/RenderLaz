[package]
name = "renderlaz"
version = "0.2.0"
description = "RenderLaz - Shader 图像特效编辑器"
authors = ["pebblek"]
edition = "2024"
rust-version = "1.85"

[lib]
# `_lib` 后缀用于避免 Windows 上 lib 与 bin 同名冲突。
name = "renderlaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.42", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "12", features = ["serde-compat"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# 体积优化：https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
